<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — Personal Task Manager</title>
<style>
:root{--ink:#251746;--muted:#786d91;--purple:#7654c5;--lav:#f1ebff;--pink:#fce8f2;--line:#e8e0f4;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#faf8ff;color:var(--ink);font:15px/1.5 Inter,system-ui,Arial}.app{max-width:1100px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.brand{font-size:1.5rem;font-weight:850;letter-spacing:-.04em}.brand span{color:var(--purple)}.sub{color:var(--muted);margin-top:4px}.back{color:var(--purple);font-weight:700;text-decoration:none}.hero{margin:28px 0;padding:28px;border-radius:24px;background:linear-gradient(120deg,#efe7ff,#ffedf5);display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.hero h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.04em}.hero p{margin:7px 0 0;color:#6f6389}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#ffffffc9;border:1px solid #ffffff;border-radius:16px;padding:13px 18px;min-width:95px}.stat b{display:block;font-size:1.5rem}.stat span{font-size:.8rem;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 10px 30px #38235c08}.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}.input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--ink);background:white}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--purple);color:white;font-weight:750;cursor:pointer}.btn:hover{filter:brightness(.95)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}.filter.active{background:var(--lav);border-color:#d8c9ff;color:#56349c;font-weight:700}.task{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid #f0ebf7}.task:last-child{border-bottom:0}.task input{width:18px;height:18px;accent-color:var(--purple)}.task-main{flex:1;min-width:0}.task-title{font-weight:750;overflow-wrap:anywhere}.done .task-title{text-decoration:line-through;color:#a49bb4}.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:4px}.pill{padding:3px 8px;border-radius:7px;background:var(--lav);color:#6646a5}.pill.high{background:#ffe8ed;color:#b44262}.delete{border:1px solid var(--line);background:white;color:#9b5670;border-radius:9px;padding:7px 10px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px 10px}.foot{color:var(--muted);font-size:.82rem;text-align:center;margin:24px}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}.hero{padding:22px}.app{padding:18px 13px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">Task<span>Flow</span></div><div class="sub">A simple, focused workspace for getting things done.</div></div><a class="back" href="../../projects.html">← Back to portfolio</a></header>
<section class="hero"><div><h1>Make room for your best work.</h1><p>Add tasks, set priorities, and keep your day moving.</p></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total tasks</span></div><div class="stat"><b id="open">0</b><span>To do</span></div><div class="stat"><b id="completed">0</b><span>Completed</span></div></div></section>
<section class="panel"><h2 style="margin-top:0">Add a task</h2><form class="form" id="taskForm"><input class="input wide" id="taskTitle" required maxlength="120" placeholder="What needs to get done?"><select id="priority" aria-label="Priority"><option value="Normal">Normal priority</option><option value="High">High priority</option><option value="Low">Low priority</option></select><input class="input" id="due" type="date" aria-label="Due date"><button class="btn" type="submit">+ Add task</button></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">Your tasks</h2><button class="delete" id="clearDone">Clear completed</button></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="open">To do</button><button class="filter" data-filter="done">Completed</button></div><div id="tasks"></div></section>
<p class="foot">TaskFlow · Saves your tasks in this browser using local storage.</p></main>
<script>
const key='fiza-taskflow-tasks-v1';let tasks=JSON.parse(localStorage.getItem(key)||'[]'),filter='all';
const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}
function render(){ $('total').textContent=tasks.length;$('open').textContent=tasks.filter(t=>!t.done).length;$('completed').textContent=tasks.filter(t=>t.done).length;
const shown=tasks.filter(t=>filter==='all'||(filter==='open'&&!t.done)||(filter==='done'&&t.done)).sort((a,b)=>Number(a.done)-Number(b.done));
$('tasks').innerHTML=shown.length?shown.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="Mark ${esc(t.title)} completed" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority==='High'?'high':''}">${t.priority} priority</span>${t.due?`<span>Due ${t.due}</span>`:''}</div></div><button class="delete" onclick="removeTask('${t.id}')">Delete</button></div>`).join(''):'<div class="empty">No tasks here yet. Add one above and get started ✨</div>'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:$('taskTitle').value.trim(),priority:$('priority').value,due:$('due').value,done:false});$('taskTitle').value='';save()});
window.toggleTask=id=>{tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save()};window.removeTask=id=>{tasks=tasks.filter(t=>t.id!==id);save()};
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));
$('clearDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save()};render();
</script></body></html>
